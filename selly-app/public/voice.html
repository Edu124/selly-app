<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a11">
<title>Selly — your order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Selly voice assistant ───────────────────────────────────────────────
   * Where a voice note lands once the customer has said what they want. It
   * picks the best kitchen for the dish, then walks the order by conversation:
   * order it? dessert? cash or UPI? Every question can be answered by voice,
   * by typing, or by tapping a suggestion — voice is the fastest way through,
   * never the only one.
   * ─────────────────────────────────────────────────────────────────────── */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a11;--surface:#13131f;--surface2:#191926;--line:#232334;--line2:#2c2c40;
    --tx:#f2f2f7;--tx2:#9c9cb8;--tx3:#64647e;
    --brand:#6d5cf6;--brandSoft:rgba(109,92,246,.13);--brandTx:#a99bff;
    --green:#2fb457;--red:#e5484d;--amber:#d8963a;
    --r-s:10px;--r-m:14px;--r-l:18px;
  }
  html,body{background:var(--bg);color:var(--tx);overflow-x:clip}
  body{min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:230px}
  button,input{font-family:inherit}
  .ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:16px;height:16px}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  .top{display:flex;align-items:center;gap:11px;padding:16px 0 4px}
  .top .pin{width:36px;height:36px;border-radius:var(--r-s);flex:none;display:grid;place-items:center;
    background:var(--brandSoft);color:var(--brandTx)}
  .top .w1{font-size:11px;color:var(--tx3);font-weight:600}
  .top .w2{font-size:14.5px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  h1{font-size:22px;font-weight:700;letter-spacing:-.5px;margin:18px 0 12px;line-height:1.25}
  .lbl{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase;margin:22px 0 10px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:15px}
  .best{border-color:rgba(109,92,246,.45);position:relative}
  .badge{display:inline-flex;align-items:center;gap:5px;background:var(--brandSoft);color:var(--brandTx);
    font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .kRow{display:flex;align-items:center;gap:12px;margin-top:12px}
  .av{width:48px;height:48px;border-radius:var(--r-m);flex:none;display:grid;place-items:center;
    background:var(--surface2);border:1px solid var(--line2);color:var(--tx2);font-size:18px;font-weight:700}
  .best .av{background:var(--brandSoft);border-color:rgba(109,92,246,.35);color:var(--brandTx)}
  .kn{font-size:16px;font-weight:700;letter-spacing:-.25px}
  .km{font-size:12px;color:var(--tx2);margin-top:2px;font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
  .dot.shut{background:var(--red)}
  .why{font-size:12px;color:var(--tx3);margin-top:12px;line-height:1.55;font-weight:500}
  .dishRow{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .dishRow b{flex:1;font-size:14px;font-weight:600}
  .dishRow span{font-size:14.5px;font-weight:700}
  .vg{width:14px;height:14px;border:1.5px solid var(--green);border-radius:3px;flex:none;display:grid;place-items:center}
  .vg::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}

  .line{display:flex;font-size:13.5px;padding:5px 0;color:var(--tx2);font-weight:500}
  .line span:last-child{margin-left:auto;color:var(--tx);font-weight:600}
  .line.tot{border-top:1px solid var(--line2);margin-top:8px;padding-top:11px;color:var(--tx);font-weight:700;font-size:15px}
  .line.tot span:last-child{font-size:17px}
  .free{background:rgba(47,180,87,.14);color:#4ec97a;font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px}

  .qrBox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .qr{background:#fff;padding:12px;border-radius:14px;line-height:0}
  .qr img,.qr canvas{display:block}
  .payBtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--green);
    color:#04220f;text-decoration:none;border-radius:var(--r-m);padding:14px;font-size:14px;font-weight:700}
  .note{font-size:11.5px;color:var(--tx3);line-height:1.55}

  .kit{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-m);padding:12px;margin-bottom:9px}
  .kit .av{width:40px;height:40px;font-size:15px}
  .kit .kn{font-size:14px}
  .kit .dist{margin-left:auto;font-size:13px;font-weight:700;flex:none}
  .muted{color:var(--tx2);font-size:13.5px;line-height:1.6;text-align:center;padding:30px 10px}

  /* ── the assistant ── */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(19,19,31,.97);
    backdrop-filter:blur(14px);border-top:1px solid var(--line2);padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
  .dock .in{max-width:560px;margin:0 auto}
  .say{display:flex;gap:10px;align-items:flex-start}
  .ava{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:var(--brand);color:#fff;font-size:13px;font-weight:800}
  .say p{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
    padding:10px 12px;font-size:13.5px;line-height:1.5;font-weight:500}
  .say .spk{background:none;border:none;color:var(--tx3);cursor:pointer;padding:6px;flex:none}
  .say .spk.on{color:var(--brandTx)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0 42px}
  .chip{background:var(--surface2);border:1px solid rgba(109,92,246,.4);color:var(--brandTx);border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .chip:hover{background:var(--brandSoft)}
  .ask{display:flex;gap:8px;margin-top:10px}
  .ask input{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:11px 15px;
    color:var(--tx);font-size:14px;outline:none}
  .ask input:focus{border-color:rgba(109,92,246,.55)}
  .mic{width:42px;height:42px;border-radius:50%;border:none;background:var(--brand);color:#fff;cursor:pointer;
    display:grid;place-items:center;flex:none}
  .mic.on{background:var(--red);animation:pulse 1.5s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}70%{box-shadow:0 0 0 14px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  .start{width:100%;background:var(--brand);border:none;color:#fff;border-radius:var(--r-m);padding:14px;
    font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  #load{display:flex;flex-direction:column;align-items:center;gap:12px;padding:90px 20px;color:var(--tx2);text-align:center}
  #load .ic{width:34px;height:34px;color:var(--tx3)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <g id="i-pin"><path d="M12 20.8c4.3-5 6.3-8.3 6.3-10.8a6.3 6.3 0 1 0-12.6 0c0 2.5 2 5.8 6.3 10.8Z"/><circle cx="12" cy="9.9" r="2.3"/></g>
  <g id="i-mic"><rect x="9.2" y="3" width="5.6" height="11" rx="2.8"/><path d="M5.6 11.2a6.4 6.4 0 0 0 12.8 0"/><path d="M12 17.6V21"/></g>
  <g id="i-speaker"><path d="M5 9.6h3.2L12.4 6v12l-4.2-3.6H5V9.6Z"/><path d="M15.6 9.6a3.6 3.6 0 0 1 0 4.8"/></g>
  <g id="i-check"><path d="m5 12.5 4.6 4.5L19 7.5"/></g>
  <g id="i-zap"><path d="M13.2 2.8 5.6 13h5.4l-1.2 8.2L17.4 11h-5.4l1.2-8.2Z"/></g>
  <g id="i-fork"><path d="M7 3.2v6a2.2 2.2 0 0 0 4.4 0v-6"/><path d="M9.2 11.2v9.6"/><path d="M16.6 3.2c-1.5 1.3-2.2 3-2 4.9.2 1.5.9 2.4 2 2.8v9.9"/></g>
  <g id="i-send"><path d="M4 12 20 4l-6 16-3-7-7-1Z"/></g>
</defs></svg>

<div class="wrap">
  <div class="top">
    <span class="pin"><svg viewBox="0 0 24 24" class="ic"><use href="#i-pin"/></svg></span>
    <span style="min-width:0"><span class="w1" id="w1">Delivering to</span><div class="w2" id="w2">…</div></span>
  </div>

  <div id="load"><svg viewBox="0 0 24 24" class="ic"><use href="#i-fork"/></svg><span id="loadMsg">Finding the best kitchen for you…</span></div>

  <div id="main" hidden>
    <h1 id="title"></h1>
    <div id="bestBox"></div>
    <div id="orderBox" hidden>
      <div class="lbl">Your order</div>
      <div class="card" id="orderCard"></div>
    </div>
    <div id="payBox" hidden>
      <div class="lbl">Pay</div>
      <div class="card" id="payCard"></div>
    </div>
    <div class="lbl" id="othersLbl">Other kitchens near you</div>
    <div id="others"></div>
  </div>
</div>

<div class="dock" id="dock" hidden>
  <div class="in">
    <div class="say">
      <span class="ava">S</span>
      <p id="sayText">…</p>
      <button class="spk" id="spk" aria-label="Say it again"><svg viewBox="0 0 24 24" class="ic sm"><use href="#i-speaker"/></svg></button>
    </div>
    <div class="chips" id="chips"></div>
    <button class="start" id="startBtn"><svg viewBox="0 0 24 24" class="ic sm"><use href="#i-speaker"/></svg>Tap to hear your suggestion</button>
    <div class="ask" id="ask" hidden>
      <input id="typed" placeholder="Say or type your answer…" autocomplete="off">
      <button class="mic" id="micBtn" aria-label="Speak"><svg viewBox="0 0 24 24" class="ic"><use href="#i-mic"/></svg></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" async></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL  = "https://ekughxkikjzkimadyyuk.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrdWdoeGtpa2p6a2ltYWR5eXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1ODkxNzQsImV4cCI6MjA5MjE2NTE3NH0.RMROZ2GAcDC6yxY8YjLW3RmyUk2c5G6HnzQry4qA2xs";

  var params = new URLSearchParams(location.search);
  var sess = params.get("s");
  var want = (params.get("q") || "").trim();

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var inr = function (n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var ic = function (id, cls) { return '<svg viewBox="0 0 24 24" class="ic' + (cls ? " " + cls : "") + '"><use href="#i-' + id + '"/></svg>'; };

  // Reads wait out a database that is still waking; placing an order is never
  // retried, because a timed-out order may already have gone through.
  function rpc(fn, body, tries) {
    tries = tries == null ? 5 : tries;
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON },
      body: JSON.stringify(body),
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = null; try { d = JSON.parse(t); } catch (e) {}
        if (r.ok) return d;
        if ((d === null || r.status >= 502) && tries > 0) return wait(6000).then(function () { return rpc(fn, body, tries - 1); });
        throw new Error((d && (d.message || d.hint)) || "Something went wrong.");
      });
    }, function () {
      if (tries > 0) return wait(6000).then(function () { return rpc(fn, body, tries - 1); });
      throw new Error("Couldn't connect.");
    });
  }

  var ctx = null, kitchens = [], menus = {}, best = null, kitchenInfo = null;
  var stage = "start", cart = [], dessert = null;

  // ── what they asked for, matched against real menus ──────────────────────
  var STOP = ["i","want","to","eat","order","a","an","some","the","please","me","get","would","like",
              "have","can","for","mujhe","chahiye","khana","hai","ek","do","one"];
  function queryWords(q) {
    return q.toLowerCase().replace(/[^a-z\s]/g, " ").split(/\s+/)
      .filter(function (w) { return w && STOP.indexOf(w) < 0; })
      .map(function (w) { return w.length > 3 ? w.replace(/s$/, "") : w; });   // "dosas" -> "dosa"
  }
  function dishMatches(name, words) {
    var nw = name.toLowerCase().split(/[^a-z]+/);
    return words.length && words.every(function (w) {
      return nw.some(function (x) { return x.indexOf(w) === 0; });
    });
  }

  /**
   * The best kitchen for the dish, and the reason, in words a person would use.
   *
   * Ranked on what we actually know: open now, serves the dish, nearest, then
   * cheapest. There is no rating in that list on purpose — we do not have
   * enough of them to rank on, and "best" built on three reviews would be a
   * claim we cannot stand behind.
   */
  function choose() {
    var words = queryWords(want);
    var cands = [];
    kitchens.forEach(function (k) {
      var menu = menus[k.public_code] || [];
      var hits = menu.filter(function (d) { return dishMatches(d.name, words); })
                     .sort(function (a, b) { return a.price - b.price; });
      if (hits.length) cands.push({ k: k, dish: hits[0], menu: menu });
    });
    cands.sort(function (a, b) {
      if (a.k.is_open !== b.k.is_open) return a.k.is_open ? -1 : 1;
      var da = a.k.distance_km == null ? 999 : +a.k.distance_km, db = b.k.distance_km == null ? 999 : +b.k.distance_km;
      if (da !== db) return da - db;
      return a.dish.price - b.dish.price;
    });
    var open = cands.filter(function (c) { return c.k.is_open; });
    best = open[0] || null;
    if (best) {
      best.why = open.length === 1
        ? "The only open kitchen within 5 km serving " + want + "."
        : "The nearest open kitchen serving " + want + (open.length > 1 ? ", out of " + open.length + " that do." : ".");
    }
  }

  // ── rendering ────────────────────────────────────────────────────────────
  function kmText(k) { return k.distance_km != null ? k.distance_km + " km" : (k.area || ""); }
  function mono(n) { return esc(String(n || "K").trim().charAt(0).toUpperCase()); }

  function render() {
    $("w2").textContent = ctx.area ? ctx.area + (ctx.city ? ", " + ctx.city : "") : (ctx.address || "");
    $("w1").textContent = "Delivering to" + (ctx.name ? " · " + ctx.name : "");

    if (best) {
      $("title").textContent = "Best " + want + " near you";
      $("bestBox").innerHTML =
        '<div class="card best">' +
          '<span class="badge">' + ic("check", "sm") + 'Best match</span>' +
          '<div class="kRow"><div class="av">' + mono(best.k.business_name) + '</div>' +
            '<div style="min-width:0"><div class="kn">' + esc(best.k.business_name) + '</div>' +
            '<div class="km"><span class="dot"></span>Open now · ' + esc(kmText(best.k)) +
              (best.k.cuisine ? " · " + esc(best.k.cuisine) : "") + '</div></div></div>' +
          '<div class="dishRow"><span class="vg"></span><b>' + esc(best.dish.name) + '</b><span>' + inr(best.dish.price) + '</span></div>' +
          '<div class="why">' + esc(best.why) + '</div>' +
        '</div>';
    } else {
      $("title").textContent = want ? "No " + want + " near you right now" : "Kitchens near you";
      $("bestBox").innerHTML = '<div class="card"><div class="muted" style="padding:14px 4px">' +
        'None of the kitchens within 5 km has ' + esc(want || "that") + ' on the menu. Tap one below to see what they do have.</div></div>';
    }

    var rest = kitchens.filter(function (k) { return !best || k.public_code !== best.k.public_code; });
    $("othersLbl").hidden = !rest.length;
    $("others").innerHTML = rest.map(function (k) {
      return '<a class="kit" href="order.html?k=' + encodeURIComponent(k.public_code) + (sess ? "&s=" + encodeURIComponent(sess) : "") + '">' +
        '<div class="av">' + mono(k.business_name) + '</div>' +
        '<div style="min-width:0"><div class="kn">' + esc(k.business_name) + '</div>' +
        '<div class="km"><span class="dot' + (k.is_open ? "" : " shut") + '"></span>' + (k.is_open ? "Open" : "Closed") +
          (k.cuisine ? " · " + esc(k.cuisine) : "") + '</div></div>' +
        '<span class="dist">' + esc(kmText(k)) + '</span></a>';
    }).join("");

    $("load").hidden = true;
    $("main").hidden = false;
    $("dock").hidden = false;
  }

  function subtotal() { return cart.reduce(function (s, l) { return s + l.price * l.qty; }, 0); }
  function deliveryFee() {
    var k = best.k, sub = subtotal(), free = Number(k.free_above || 0);
    if (free > 0 && sub >= free) return 0;
    return Number(k.delivery_charge || 0);
  }
  function renderOrder() {
    var fee = deliveryFee();
    $("orderCard").innerHTML = cart.map(function (l) {
      return '<div class="line"><span>' + l.qty + ' × ' + esc(l.name) + '</span><span>' + inr(l.price * l.qty) + '</span></div>';
    }).join("") +
      '<div class="line"><span>Delivery</span><span>' + (fee ? inr(fee) : '<span class="free">FREE</span>') + '</span></div>' +
      '<div class="line tot"><span>To pay</span><span>' + inr(subtotal() + fee) + '</span></div>';
    $("orderBox").hidden = false;
  }

  // ── the conversation ─────────────────────────────────────────────────────
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var TTS = window.speechSynthesis;
  var rec = null, wantEar = false, gen = 0, lastLine = "";

  function speak(text, then) {
    stopEar();
    lastLine = text;
    $("sayText").textContent = text;
    $("spk").classList.add("on");
    var done = false, go = function () {
      if (done) return; done = true; $("spk").classList.remove("on"); if (then) then();
    };
    if (!TTS) return go();
    try { TTS.cancel(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(text.replace(/₹\s?(\d[\d,]*)/g, "$1 rupees"));
    u.lang = "en-IN"; u.rate = 1;
    var v = (TTS.getVoices() || []).filter(function (x) { return /en[-_]IN/i.test(x.lang); })[0];
    if (v) u.voice = v;
    u.onend = go; u.onerror = go;
    setTimeout(go, Math.min(1500 + text.length * 80, 12000));   // never stall on a silent engine
    try { TTS.speak(u); } catch (e) { go(); }
  }

  function chips(list) {
    $("chips").innerHTML = "";
    (list || []).forEach(function (c) {
      var b = document.createElement("button");
      b.className = "chip"; b.textContent = c;
      b.onclick = function () { answer(c); };
      $("chips").appendChild(b);
    });
  }

  // Ask a question: say it, show the answers, then listen for one.
  function ask(text, list) {
    chips(list);
    speak(text, function () { listen(); });
  }

  function stopEar() {
    wantEar = false; gen++;
    if (rec) { try { rec.abort(); } catch (e) {} }
    rec = null;
    $("micBtn").classList.remove("on");
  }

  function listen() {
    if (!SR || stage === "done" || stage === "browse") return;
    stopEar();
    wantEar = true;
    var g = ++gen, r = new SR();
    rec = r;
    r.lang = "en-IN"; r.interimResults = true; r.continuous = false;
    r.onstart = function () { if (g === gen) $("micBtn").classList.add("on"); };
    r.onresult = function (e) {
      if (g !== gen) return;
      var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      $("typed").value = t;
      if (e.results[e.results.length - 1].isFinal) { stopEar(); $("typed").value = ""; answer(t); }
    };
    r.onerror = function (e) {
      if (g !== gen) return;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { stopEar(); }
    };
    // Chrome ends a session after any pause. Still waiting for an answer: open another.
    r.onend = function () {
      if (g === gen && wantEar) setTimeout(function () { if (g === gen && wantEar) { try { r.start(); } catch (e) {} } }, 250);
    };
    try { r.start(); } catch (e) {}
  }

  // What kind of answer was that. Payment words first, so "yes, cash" is cash.
  function kind(t) {
    t = " " + String(t).toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ") + " ";
    var has = function (l) { return l.some(function (w) { return t.indexOf(" " + w + " ") >= 0; }); };
    if (has(["cash", "cod", "nagad", "nakad"]) || t.indexOf(" on delivery ") >= 0) return "cash";
    if (has(["upi", "gpay", "phonepe", "paytm", "qr", "online", "scan"])) return "upi";
    if (has(["no", "nope", "nah", "nahi", "nahin", "dont", "skip", "cancel", "other", "others", "options", "else", "later"])) return "no";
    if (has(["yes", "yeah", "yep", "ok", "okay", "sure", "haan", "han", "ha", "ji", "order", "add", "confirm", "please", "theek", "thik", "go"])) return "yes";
    return null;
  }

  function answer(text) {
    var k = kind(text);
    chips([]);

    if (stage === "suggest") {
      if (k === "yes") {
        cart = [{ id: best.dish.id, name: best.dish.name, price: Number(best.dish.price), qty: 1 }];
        renderOrder();
        dessert = (best.menu || []).filter(function (d) { return /dessert|sweet|mithai/i.test(d.category || ""); })
                                   .sort(function (a, b) { return a.price - b.price; })[0] || null;
        if (dessert) {
          stage = "dessert";
          return ask("Added " + best.dish.name + ". Would you like a dessert too? They have " + dessert.name +
                     " for ₹" + dessert.price + ".", ["Add " + dessert.name, "No thanks"]);
        }
        return askPay();
      }
      if (k === "no") {
        stage = "browse";
        chips([]);
        $("others").scrollIntoView({ behavior: "smooth", block: "start" });
        return speak("Sure. Here are the other kitchens near you. Tap one to see its menu.");
      }
      return ask("Sorry, I didn't catch that. Should I order " + best.dish.name + " from " + best.k.business_name + "?",
                 ["Yes, order that", "Show other options"]);
    }

    if (stage === "dessert") {
      if (k === "yes") {
        cart.push({ id: dessert.id, name: dessert.name, price: Number(dessert.price), qty: 1 });
        renderOrder();
        return askPay("Added " + dessert.name + ". ");
      }
      if (k === "no") return askPay();
      return ask("Should I add " + dessert.name + "?", ["Add " + dessert.name, "No thanks"]);
    }

    if (stage === "pay") {
      if (k === "cash") return place("cod");
      if (k === "upi") {
        if (kitchenInfo && kitchenInfo.upi_id) return place("upi");
        stage = "cashonly";
        return ask(best.k.business_name + " hasn't set up UPI payments yet, so this one would be cash on delivery. Shall I place it?",
                   ["Yes, cash on delivery", "Cancel"]);
      }
      return ask("Cash on delivery, or UPI?", ["Cash", "UPI"]);
    }

    if (stage === "cashonly") {
      if (k === "yes" || k === "cash") return place("cod");
      stage = "browse";
      return speak("Okay, I haven't placed anything. Your order is still here if you change your mind.");
    }
  }

  function askPay(prefix) {
    stage = "pay";
    var total = subtotal() + deliveryFee();
    ask((prefix || "") + "Your total is ₹" + total + ". Cash on delivery, or UPI?", ["Cash", "UPI"]);
  }

  function place(mode) {
    stage = "placing";
    chips([]);
    $("sayText").textContent = "Placing your order…";
    rpc("place_public_order", {
      p_code: best.k.public_code,
      p_name: ctx.name || "Guest",
      p_mobile: ctx.mobile,
      p_address: ctx.address || [ctx.area, ctx.city].filter(Boolean).join(", "),
      p_items: cart.map(function (l) { return { id: l.id, qty: l.qty, portion: null, addOns: [] }; }),
      p_payment: mode,
      p_note: null,
    }, 0).then(function (rows) {
      var r = rows && rows[0];
      if (!r) throw new Error("no order");
      stage = "done";
      var total = Number(r.total != null ? r.total : subtotal() + deliveryFee());
      var shortId = String(r.order_id).slice(-5);
      var payLink = null;

      if (mode === "upi") {
        payLink = "upi://pay?pa=" + encodeURIComponent(kitchenInfo.upi_id) +
          "&pn=" + encodeURIComponent(best.k.business_name) + "&am=" + total.toFixed(2) + "&cu=INR" +
          "&tn=" + encodeURIComponent("Order " + shortId) +
          "&tr=" + encodeURIComponent("SELLY" + String(r.order_id).replace(/\D/g, "").slice(-8));
        $("payCard").innerHTML =
          '<div class="qrBox"><div class="qr" id="qr"></div>' +
          '<div style="font-size:15px;font-weight:700">Scan to pay ' + inr(total) + '</div>' +
          '<div class="note">Order #' + shortId + ' is placed. Scan with any UPI app on another phone, ' +
          'or pay from this one:</div>' +
          '<a class="payBtn" href="' + esc(payLink) + '">' + ic("zap", "sm") + 'Open UPI app</a></div>';
        $("payBox").hidden = false;
        var draw = function (n) {
          if (window.QRCode) { new QRCode($("qr"), { text: payLink, width: 188, height: 188, correctLevel: QRCode.CorrectLevel.M }); }
          else if (n < 20) setTimeout(function () { draw(n + 1); }, 250);
          else $("qr").outerHTML = '<div class="note">The QR code couldn\'t load — use the button below.</div>';
        };
        draw(0);
        $("payBox").scrollIntoView({ behavior: "smooth", block: "start" });
        speak("Done! Order " + shortId + " is placed. Scan the QR code to pay ₹" + total + ".");
      } else {
        $("orderCard").insertAdjacentHTML("beforeend",
          '<div class="line" style="color:var(--green);font-weight:700;margin-top:6px">' + ic("check", "sm") +
          '&nbsp;Order #' + shortId + ' placed · cash on delivery</div>');
        speak("Done! Order " + shortId + " is placed. ₹" + total + ", cash on delivery. The kitchen has it now.");
      }
      $("ask").hidden = true;

      // Running inside the demo phone: let the thread show the confirmation.
      // A UPI order keeps this page open, because the QR code has to stay on screen.
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ selly: "order-placed", orderId: r.order_id, total: total,
                                      payMode: mode, payLink: payLink, stay: mode === "upi" }, location.origin);
        }
      } catch (e) {}
    }).catch(function () {
      stage = "pay";
      ask("I couldn't confirm the order — the connection dropped. Please wait a moment before trying again, so it isn't placed twice. Cash or UPI?",
          ["Cash", "UPI"]);
    });
  }

  // ── controls ─────────────────────────────────────────────────────────────
  // Browsers will not speak until the page has been touched, so the first
  // suggestion is started by a tap. That tap also clears the way for the mic.
  $("startBtn").onclick = function () {
    $("startBtn").hidden = true;
    $("ask").hidden = false;
    if (best) {
      stage = "suggest";
      ask("I found " + best.dish.name + " at " + best.k.business_name + ", " +
          (best.k.distance_km != null ? best.k.distance_km + " kilometres away" : "near you") +
          ", for ₹" + best.dish.price + ". Should I order that?", ["Yes, order that", "Show other options"]);
    } else {
      stage = "browse";
      speak("I couldn't find " + (want || "that") + " within 5 kilometres. Here are the kitchens near you — tap one to see its menu.");
    }
  };
  $("spk").onclick = function () { if (lastLine) speak(lastLine, stage !== "done" && stage !== "browse" ? listen : null); };
  $("micBtn").onclick = function () { if (wantEar) stopEar(); else listen(); };
  if (!SR) $("micBtn").hidden = true;
  $("typed").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.value.trim()) { var v = e.target.value; e.target.value = ""; answer(v); }
  });

  // ── load ─────────────────────────────────────────────────────────────────
  if (!sess) {
    $("loadMsg").textContent = "This link is missing its session. Text us again to get a fresh one.";
    return;
  }
  rpc("session_context", { p_token: sess })
    .then(function (rows) {
      ctx = rows && rows[0];
      if (!ctx) throw new Error("This link has expired. Text us again to get a fresh one.");
      return rpc("kitchens_for", { p_lat: ctx.lat, p_lng: ctx.lng, p_area: ctx.area || null,
                                   p_city: ctx.city || null, p_max_km: 5 });
    })
    .then(function (rows) {
      kitchens = (rows || []).slice(0, 12);
      return Promise.all(kitchens.map(function (k) {
        return rpc("get_public_menu", { p_code: k.public_code })
          .then(function (m) { menus[k.public_code] = m || []; })
          .catch(function () { menus[k.public_code] = []; });
      }));
    })
    .then(function () {
      choose();
      if (!best) return null;
      return rpc("get_public_kitchen", { p_code: best.k.public_code })
        .then(function (rows) { kitchenInfo = rows && rows[0]; });
    })
    .then(render)
    .catch(function (e) { $("loadMsg").textContent = e.message; });
})();
</script>
</body>
</html>

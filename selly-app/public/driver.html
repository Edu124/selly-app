<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="robots" content="noindex">
<title>Deliveries</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a12;--card:#14141f;--elev:#1c1c2b;--line:#242437;
    --tx:#f2f2f7;--tx2:#9a9ab4;--tx3:#63637d;
    --violet:#7c5cff;--green:#22c55e;--amber:#f5a524;--red:#ef4444;
  }
  html,body{background:var(--bg);color:var(--tx);overflow-x:clip}
  body{min-height:100vh;padding:18px 16px calc(28px + env(safe-area-inset-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .top h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
  .top .who{color:var(--tx3);font-size:11.5px;margin-top:2px}

  /* ── token entry: the whole screen, basically ── */
  .entry{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .entry label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:10px}
  .tokenRow{display:flex;gap:10px}
  #token{flex:1;background:var(--bg);border:2px solid var(--line);border-radius:14px;
    padding:18px;color:var(--tx);font-size:34px;font-weight:800;text-align:center;
    letter-spacing:5px;outline:none;font-family:inherit}
  #token:focus{border-color:var(--violet)}
  #token::placeholder{color:var(--tx3);letter-spacing:3px;font-weight:600}
  .find{background:var(--violet);border:none;color:#fff;border-radius:14px;
    padding:0 24px;font-size:16px;font-weight:800;cursor:pointer;min-width:96px}
  .find:disabled{background:var(--line);color:var(--tx3)}
  .hint{color:var(--tx3);font-size:11.5px;margin-top:11px;line-height:1.5}

  .err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.3);border-radius:12px;
    padding:13px;color:#f87171;font-size:13px;margin-top:14px;display:none;line-height:1.5}
  .err.on{display:block}

  /* ── the run ── */
  .runHead{display:flex;align-items:center;gap:9px;margin:24px 0 12px}
  .runHead h2{font-size:12px;font-weight:800;color:var(--tx3);letter-spacing:.9px}
  .runHead .all{margin-left:auto;color:#9d87ff;font-size:12px;font-weight:700;
    text-decoration:none;background:none;border:none;cursor:pointer}

  .advice{display:flex;gap:9px;align-items:flex-start;background:rgba(124,92,255,.11);
    border:1px solid rgba(124,92,255,.3);border-radius:13px;padding:13px;margin-bottom:13px;
    font-size:13px;line-height:1.55;color:var(--tx)}

  .drop{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px;margin-bottom:12px}
  .drop.late{border-color:rgba(239,68,68,.4)}
  .dHead{display:flex;align-items:center;gap:11px}
  .seq{width:29px;height:29px;border-radius:50%;background:var(--elev);color:var(--tx2);
    display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
  .drop.late .seq{background:rgba(239,68,68,.18);color:#f87171}
  .tok{font-size:25px;font-weight:800;letter-spacing:-.5px}
  .amt{margin-left:auto;text-align:right}
  .amt b{font-size:16px;font-weight:800;display:block}
  .amt span{font-size:10.5px;color:var(--amber);font-weight:700}
  .amt span.paid{color:var(--green)}

  .why{font-size:11.5px;color:var(--tx2);margin-top:9px}
  .drop.late .why{color:#f87171;font-weight:700}

  .name{font-size:15px;font-weight:700;margin-top:13px}
  .addr{color:var(--tx2);font-size:13.5px;line-height:1.55;margin-top:6px}
  .items{color:var(--tx3);font-size:12px;margin-top:8px;line-height:1.5}

  .btns{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .btn{flex:1;min-width:120px;border:none;border-radius:12px;padding:15px;
    font-size:14px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:7px}
  .map{background:#1a73e8;color:#fff}
  .call{background:var(--elev);color:var(--tx);border:1px solid var(--line)}
  .pick{background:var(--amber);color:#231600}
  .done{background:var(--green);color:#04220f}
  .btn:disabled{background:var(--line);color:var(--tx3);cursor:not-allowed}

  /* ── otp ── */
  .otpBox{margin-top:14px;background:var(--bg);border:1px solid var(--line);
    border-radius:13px;padding:14px;display:none}
  .otpBox.on{display:block}
  .otpBox p{font-size:12.5px;color:var(--tx2);margin-bottom:10px;line-height:1.5}
  .otpRow{display:flex;gap:9px}
  .otpRow input{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:14px;color:var(--tx);font-size:26px;font-weight:800;text-align:center;
    letter-spacing:9px;outline:none;font-family:inherit}
  .otpRow input:focus{border-color:var(--green)}
  .noOtp{display:flex;gap:8px;align-items:center;margin-top:13px;
    background:rgba(34,197,94,.10);border-radius:11px;padding:11px;
    font-size:12.5px;color:var(--green);font-weight:600}

  .ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.32);border-radius:13px;
    padding:14px;color:#4ade80;font-size:13.5px;font-weight:700;text-align:center;margin-top:12px}

  .empty{color:var(--tx3);font-size:12.5px;text-align:center;padding:26px 10px;line-height:1.6}
  .foot{color:var(--tx3);font-size:11px;text-align:center;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span style="font-size:24px">🛵</span>
    <div>
      <h1 id="partner">Deliveries</h1>
      <div class="who" id="kitchen">Enter the number on the packet</div>
    </div>
  </div>

  <div class="entry">
    <label for="token">PACKET NUMBER</label>
    <div class="tokenRow">
      <input id="token" inputmode="numeric" maxlength="3" placeholder="00" autocomplete="off">
      <button class="find" id="find">Find</button>
    </div>
    <p class="hint">The number on the sticker. Add each packet you're carrying — we'll tell you which to drop first.</p>
    <div class="err" id="err"></div>
  </div>

  <div id="runWrap" style="display:none">
    <div class="runHead">
      <h2 id="runLabel">YOUR RUN</h2>
      <button class="all" id="routeAll">Open full route ↗</button>
    </div>
    <div class="advice" id="advice"></div>
    <div id="drops"></div>
  </div>

  <div class="empty" id="empty">Nothing added yet.</div>

  <p class="foot">
    The packet only carries a number. Names and addresses stay here.
  </p>
</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL  = "https://ekughxkikjzkimadyyuk.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrdWdoeGtpa2p6a2ltYWR5eXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1ODkxNzQsImV4cCI6MjA5MjE2NTE3NH0.RMROZ2GAcDC6yxY8YjLW3RmyUk2c5G6HnzQry4qA2xs";

  var code = new URLSearchParams(location.search).get("c");
  var run  = [];                       // packets this rider is carrying

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };

  function rpc(fn, body) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method : "POST",
      headers: { "Content-Type": "application/json",
                 "apikey": SUPABASE_ANON, "Authorization": "Bearer " + SUPABASE_ANON },
      body   : JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error((d && (d.message || d.hint)) || "Something went wrong.");
        return d;
      });
    });
  }

  // Riders get a sentence they can act on. A raw Postgres string tells someone
  // standing outside a building in the rain precisely nothing.
  function fail(msg) {
    var m = String(msg || "");
    if (/schema cache|does not exist|function public\./i.test(m)) {
      m = "Deliveries aren't switched on for this kitchen yet. Call them.";
    } else if (/Failed to fetch|NetworkError|Load failed/i.test(m)) {
      m = "No connection. Check your data and try again.";
    }
    $("err").textContent = m;
    $("err").classList.add("on");
  }
  function clearErr() { $("err").classList.remove("on"); }

  // ── Sequencing ──────────────────────────────────────────────────────────
  // Mirrors src/lib/dispatch.js. Ranks on how late each drop is, nudged by
  // whether two addresses name the same area — there are no coordinates to work
  // with, so this is a heuristic and not a routing engine.
  var NOISE = ["flat","no","near","opp","opposite","behind","road","rd","lane","society",
               "apartment","apartments","building","wing","floor","block","sector","phase",
               "plot","house","villa","tower","residency","park","cross","main","st","street","nagar"];
  var LANDMARK = /^(near|opp|opposite|behind|beside|next to|above|below|in front of)\b/;

  function areaOf(addr) {
    var parts = String(addr || "").split(",").map(function (p) { return p.trim().toLowerCase(); })
                 .filter(Boolean);
    for (var i = parts.length - 1; i >= 0; i--) {
      if (LANDMARK.test(parts[i])) continue;
      var w = parts[i].split(/\s+/).filter(function (x) {
        return x.length > 2 && NOISE.indexOf(x) === -1 && !/^\d+$/.test(x);
      });
      if (w.length) return w.join(" ");
    }
    return parts.length ? parts[parts.length - 1] : "";
  }
  function sameArea(a, b) {
    var x = areaOf(a), y = areaOf(b);
    return !!x && !!y && (x === y || x.indexOf(y) !== -1 || y.indexOf(x) !== -1);
  }

  // "848 min late" is true and useless -- nobody reads that as fourteen hours.
  function lateness(mins) {
    var m = Math.abs(Math.round(mins));
    if (m < 90) return m + " min";
    var h = Math.round(m / 60);
    if (h < 24) return h + " hr";
    var d = Math.round(h / 24);
    return d + (d === 1 ? " day" : " days");
  }

  function sequence(list) {
    var pool = list.slice(), out = [], prev = null, clock = 0;
    while (pool.length) {
      var best = 0, bestScore = -Infinity, why = "";
      pool.forEach(function (p, i) {
        var slack = (p.slackMins == null ? 999 : p.slackMins) - clock;
        var score = slack < 0 ? 1000 + (-slack) * 10 : Math.max(0, 200 - slack * 3);
        var w     = slack < 0 ? "already " + lateness(-slack) + " late" : "due in " + lateness(slack);
        if (prev && sameArea(prev.address, p.address)) { score += 30; w += " · same area as your last drop"; }
        if (score > bestScore) { bestScore = score; best = i; why = w; }
      });
      var picked = pool.splice(best, 1)[0];
      clock += 12;
      picked.seq = out.length + 1;
      picked.why = why;
      picked.late = (picked.slackMins != null && picked.slackMins < 0);
      out.push(picked);
      prev = picked;
    }
    return out;
  }

  // ── Look up a packet ────────────────────────────────────────────────────
  function find() {
    var t = $("token").value.replace(/\s/g, "");
    if (!t) return;
    if (!code) return fail("This link is missing its code. Ask the kitchen to send it again.");
    if (run.some(function (d) { return d.token === t; })) {
      $("token").value = ""; return fail("Packet " + t + " is already in your run.");
    }

    clearErr();
    $("find").disabled = true; $("find").textContent = "…";

    rpc("driver_lookup", { p_code: code, p_token: t })
      .then(function (rows) {
        var d = rows && rows[0];
        if (!d) throw new Error("No open order with that number.");
        // Slack is unknown to the driver page; the kitchen decides urgency and
        // it rides along on the order. Absent, it sorts as not-urgent.
        d.slackMins = d.slack_mins != null ? d.slack_mins : null;
        run.push(d);
        $("token").value = "";
        $("partner").textContent = "Deliveries";
        $("kitchen").textContent = d.kitchen + (d.kitchen_phone ? " · " + d.kitchen_phone : "");
        render();
      })
      .catch(function (e) { fail(e.message); })
      .finally(function () { $("find").disabled = false; $("find").textContent = "Find"; });
  }

  $("find").onclick = find;
  $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") find(); });

  // ── Render the run ──────────────────────────────────────────────────────
  function render() {
    if (!run.length) {
      $("runWrap").style.display = "none";
      $("empty").style.display = "block";
      return;
    }
    $("empty").style.display = "none";
    $("runWrap").style.display = "block";

    var seq = sequence(run);
    $("runLabel").textContent = "YOUR RUN · " + seq.length + " PACKET" + (seq.length === 1 ? "" : "S");

    var late = seq.filter(function (s) { return s.late; }).length;
    $("advice").innerHTML = "<span>🧭</span><span>" + (
      seq.length === 1 ? "One packet. Head to <b>#" + esc(seq[0].token) + "</b>."
      : late > 1 ? "<b>" + late + " drops are already late.</b> Start with #" + esc(seq[0].token) + "."
      : late === 1 ? "<b>#" + esc(seq[0].token) + " is already late.</b> Go there first."
      : "Start with <b>#" + esc(seq[0].token) + "</b> — " + esc(seq[0].why) + "."
    ) + "</span>";

    $("drops").innerHTML = "";
    seq.forEach(function (d) { $("drops").appendChild(card(d)); });
  }

  function card(d) {
    var el = document.createElement("div");
    el.className = "drop" + (d.late ? " late" : "");

    var items = (d.items || []).map(function (i) {
      return (i.qty || 1) + "× " + (i.name || "Item");
    }).join(", ");
    var unpaid = d.payment_mode === "cod";

    el.innerHTML =
      '<div class="dHead">' +
        '<div class="seq">' + d.seq + '</div>' +
        '<div class="tok">#' + esc(d.token) + '</div>' +
        '<div class="amt"><b>₹' + (d.amount || 0) + '</b>' +
          '<span class="' + (unpaid ? "" : "paid") + '">' +
            (unpaid ? "COLLECT CASH" : "ALREADY PAID") + '</span></div>' +
      '</div>' +
      '<div class="why">' + esc(d.why || "") + '</div>' +
      '<div class="name">' + esc(d.customer || "Customer") + '</div>' +
      '<div class="addr">📍 ' + esc(d.address || "") + '</div>' +
      (items ? '<div class="items">' + esc(items) + '</div>' : "");

    var btns = document.createElement("div");
    btns.className = "btns";

    var map = document.createElement("a");
    map.className = "btn map";
    map.href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(d.address || "");
    map.target = "_blank";
    map.rel = "noopener";
    map.innerHTML = "🗺 Maps";
    btns.appendChild(map);

    if (d.mobile) {
      var call = document.createElement("a");
      call.className = "btn call";
      call.href = "tel:+91" + d.mobile;
      call.innerHTML = "📞 Call";
      btns.appendChild(call);
    }
    el.appendChild(btns);

    // Picked up -> delivered, in that order, because a rider who marks delivered
    // from the kitchen is the failure this is meant to make awkward.
    var act = document.createElement("div");
    act.className = "btns";

    if (!d.picked_up) {
      var pick = document.createElement("button");
      pick.className = "btn pick";
      pick.textContent = "Picked up";
      pick.onclick = function () { update(d, "picked_up", null, pick); };
      act.appendChild(pick);
    } else {
      var done = document.createElement("button");
      done.className = "btn done";
      done.textContent = "Delivered";
      done.onclick = function () { deliver(d, el, done); };
      act.appendChild(done);
    }
    el.appendChild(act);

    // OTP only when the kitchen issued one. Members never get asked.
    var otp = document.createElement("div");
    otp.className = "otpBox";
    otp.innerHTML =
      '<p>Ask the customer for their 4-digit code.</p>' +
      '<div class="otpRow"><input inputmode="numeric" maxlength="4" placeholder="––––"></div>';
    el.appendChild(otp);
    d._otpBox = otp;

    if (d.picked_up && !d.needs_otp) {
      var no = document.createElement("div");
      no.className = "noOtp";
      no.innerHTML = "✓ Monthly customer — no code needed";
      el.appendChild(no);
    }
    return el;
  }

  function update(d, event, otpValue, btn) {
    btn.disabled = true;
    var was = btn.textContent;
    btn.textContent = "…";
    rpc("driver_update", {
      p_code: code, p_token: d.token, p_event: event,
      p_otp : otpValue || null, p_driver: null
    })
      .then(function () {
        if (event === "picked_up") { d.picked_up = true; render(); }
        else {
          run = run.filter(function (x) { return x.token !== d.token; });
          render();
        }
      })
      .catch(function (e) {
        fail(e.message);
        btn.disabled = false; btn.textContent = was;
      });
  }

  function deliver(d, el, btn) {
    if (!d.needs_otp) return update(d, "delivered", null, btn);

    var box = d._otpBox;
    var input = box.querySelector("input");
    if (!box.classList.contains("on")) {
      box.classList.add("on");
      input.focus();
      btn.textContent = "Confirm delivery";
      return;
    }
    var v = input.value.replace(/\D/g, "");
    if (v.length !== 4) return fail("Enter the 4-digit code from the customer.");
    update(d, "delivered", v, btn);
  }

  // ── Whole route in one go ───────────────────────────────────────────────
  $("routeAll").onclick = function () {
    var seq = sequence(run);
    var stops = seq.map(function (s) { return s.address; }).filter(Boolean);
    if (!stops.length) return;
    var dest = encodeURIComponent(stops[stops.length - 1]);
    var way  = stops.slice(0, -1).map(encodeURIComponent).join("%7C");
    window.open("https://www.google.com/maps/dir/?api=1&destination=" + dest +
                (way ? "&waypoints=" + way : ""), "_blank", "noopener");
  };

  if (!code) fail("This link is missing its code. Ask the kitchen to send it again.");
  $("token").focus();
})();
</script>
</body>
</html>
